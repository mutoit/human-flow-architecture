# Human Flow en Cloudflare: la web (dist/) y la API (/api/*) en un solo Worker.
# Pasos completos en docs/DEPLOY.md.
name = "humanflow"
main = "extractor.js"
compatibility_date = "2026-09-01"

[assets]
directory = "../dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[observability]
enabled = true

[vars]
EXTRACT_MODEL = "claude-opus-5"
VERIFY_MODEL = "claude-opus-5"

# Registro persistente. Crear con:  npx wrangler d1 create humanflow-logs
# y pegar aquí el database_id que devuelve.
[[d1_databases]]
binding = "DB"
database_name = "humanflow-logs"
database_id = "PEGAR_AQUI_EL_ID"
migrations_dir = "migrations"
